<h1 id="heading">Open items</h1>
<p class="intro" id="intro">Open means still pending, or active since October 31, 2026. Everything older is under Resolved.</p>
<form class="filters" id="filters">
  <div><label>Search</label><input type="text" name="q" size="26" placeholder="words, ID, docket number"></div>
  <div><label>Source</label><select name="source"><option value="">All</option><option value="E">ERCOT</option><option value="P">PUC</option><option value="L">Legislature</option></select></div>
  <div><label>Type</label><select name="type"><option value="">All</option></select></div>
  <div><label>Relevance</label><select name="rel"><option value="">All</option><option value="h">high</option><option value="m">medium</option><option value="l">low</option></select></div>
  <div><label>Status</label><select name="status"><option value="open">Open</option><option value="resolved">Resolved</option><option value="all">All</option></select></div>
  <div><label>Activity from</label><input type="date" name="from"></div>
  <div><label>to</label><input type="date" name="to"></div>
  <div><label>Sort</label><select name="sort"><option value="queue">Relevance, then deadline</option><option value="score">Score</option><option value="deadline">Deadline</option><option value="activity">Latest activity</option><option value="changed">Last changed</option><option value="posted">Date posted</option><option value="id">ID</option></select></div>
  <div><label><input type="checkbox" name="imm" value="1"> IMM engaged</label><label><input type="checkbox" name="deadline" value="1"> Has deadline</label></div>
  <div><button class="primary">Filter</button> <a class="btn" href="index.html" id="clear">Clear</a></div>
</form>
<div class="bar small"><span id="count"></span><span class="grow"></span><button type="button" id="csv">CSV</button></div>

<thead><tr><th>Relevance</th><th>ID</th><th>Title</th><th>Source status</th><th>Deadline</th><th>Last activity</th></tr></thead>
<tbody><tr><td colspan="6" class="muted">Loading the list.</td></tr></tbody></table></div>
